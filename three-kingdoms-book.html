<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三國志立體繪本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf4e6;
    --paper-2:#f3e6cc;
    --ink:#4a3a2c;
    --ink-soft:#7a6552;
    --wood:#8a5a3b;
    --gold:#d9a441;
    --accent:#e58aa3;
    --accent-2:#7cbf8e;
    --shadow:0 10px 30px rgba(74,58,44,.18), 0 2px 6px rgba(74,58,44,.12);
    --radius:18px;
    --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  body[data-book="0"]{--accent:#e58aa3;--accent-2:#7cbf8e}
  body[data-book="1"]{--accent:#6f9fbf;--accent-2:#3f6b5e}
  body[data-book="2"]{--accent:#8b8f96;--accent-2:#5fb3c4}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#f1e2c6;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none;touch-action:none}
  #trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none !important}

  /* ---------- Top bar ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:max(12px,env(safe-area-inset-top)) 16px 0;z-index:20;pointer-events:none}
  #brand{pointer-events:auto;display:flex;align-items:center;gap:10px;background:rgba(251,244,230,.86);backdrop-filter:blur(6px);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);font-family:var(--serif);font-weight:900;letter-spacing:.08em;font-size:15px;white-space:nowrap}
  #brand .seal{width:26px;height:26px;border-radius:7px;background:#c8443c;color:#fff;display:grid;place-items:center;font-size:14px;letter-spacing:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
  #badges{display:flex;gap:4px}
  #badges .b{width:24px;height:24px;border-radius:50%;background:#e9dcc4;display:grid;place-items:center;opacity:.35;transition:.4s}
  #badges .b.got{opacity:1;background:linear-gradient(145deg,#ffe29a,#d9a441);box-shadow:0 2px 6px rgba(217,164,65,.5)}
  #badges .b svg{width:16px;height:16px}
  #tools{pointer-events:auto;display:flex;gap:8px}
  .iconbtn{height:42px;min-width:42px;padding:0 12px;border:none;border-radius:999px;background:rgba(251,244,230,.9);color:var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;transition:transform .2s,background .2s,opacity .2s}
  .iconbtn:hover{transform:translateY(-2px);background:#fff}
  .iconbtn svg{width:20px;height:20px}
  .iconbtn.on{background:var(--accent);color:#fff}
  #btnMute{width:42px;padding:0}

  /* ---------- Chapter card (top) ---------- */
  #chapter{position:fixed;top:max(66px,calc(env(safe-area-inset-top) + 58px));left:50%;transform:translateX(-50%);z-index:15;background:rgba(251,244,230,.9);backdrop-filter:blur(6px);border-radius:14px;padding:8px 18px;box-shadow:var(--shadow);text-align:center;transition:opacity .5s,transform .5s;max-width:calc(100vw - 32px)}
  #chapter .bk{font-family:var(--serif);font-weight:900;font-size:16px;letter-spacing:.1em}
  #chapter .ac{font-size:13px;color:var(--ink-soft);margin-top:2px}
  #chapter .dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
  #chapter .dots i{width:8px;height:8px;border-radius:50%;background:#dccdb2;transition:.3s}
  #chapter .dots i.on{background:var(--accent);transform:scale(1.25)}
  #chapter.off{opacity:0;transform:translate(-50%,-12px);pointer-events:none}

  /* ---------- Dialog card (bottom) ---------- */
  #dialog{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(720px,calc(100vw - 32px));z-index:15;background:linear-gradient(180deg,rgba(251,244,230,.96),rgba(243,230,204,.96));border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 20px 14px;border:2px solid rgba(255,255,255,.7);transition:opacity .45s,transform .45s}
  #dialog.off{opacity:0;transform:translate(-50%,20px);pointer-events:none}
  #dialog::before{content:"";position:absolute;inset:5px;border:1px dashed rgba(138,90,59,.25);border-radius:14px;pointer-events:none}
  #speaker{display:inline-block;font-family:var(--serif);font-weight:900;font-size:14px;color:#fff;background:var(--accent);padding:3px 12px;border-radius:999px;margin-bottom:6px;letter-spacing:.1em;transition:background .3s}
  #speaker.narr{background:var(--wood)}
  #dlgText{font-size:clamp(15px,2.3vw,18px);line-height:1.7;min-height:1.7em;letter-spacing:.03em}
  #hint{margin-top:6px;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;min-height:20px}
  #hint:not(:empty)::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(217,164,65,.6);animation:ping 1.6s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(217,164,65,.7)}70%{box-shadow:0 0 0 10px rgba(217,164,65,0)}100%{box-shadow:0 0 0 0 rgba(217,164,65,0)}}
  #actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
  #actions:empty{display:none}
  .btn{border:none;border-radius:999px;padding:10px 20px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s,opacity .2s;letter-spacing:.05em}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.12)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn.pulse{animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  /* ---------- Shelf bar ---------- */
  #shelfBar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(760px,calc(100vw - 32px));transition:opacity .45s,transform .45s}
  #shelfBar.off{opacity:0;transform:translate(-50%,24px);pointer-events:none}
  #shelfBar .tip{background:rgba(251,244,230,.92);padding:8px 18px;border-radius:999px;box-shadow:var(--shadow);font-size:15px;text-align:center}
  #shelfBar .row{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
  .bookBtn{flex:1 1 180px;max-width:240px;display:flex;align-items:center;gap:10px;padding:10px 14px;border:none;border-radius:16px;background:rgba(251,244,230,.95);box-shadow:var(--shadow);text-align:left;color:var(--ink);transition:transform .2s}
  .bookBtn:hover{transform:translateY(-4px)}
  .bookBtn .sw{width:30px;height:40px;border-radius:4px 7px 7px 4px;flex:none;box-shadow:inset 4px 0 0 rgba(0,0,0,.15)}
  .bookBtn b{display:block;font-family:var(--serif);font-size:16px;letter-spacing:.06em}
  .bookBtn small{color:var(--ink-soft);font-size:12px}
  .bookBtn .medal{margin-left:auto;width:22px;height:22px;border-radius:50%;background:linear-gradient(145deg,#ffe29a,#d9a441);display:grid;place-items:center;flex:none}
  .bookBtn .medal svg{width:14px;height:14px}

  /* ---------- Modals ---------- */
  .modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(74,58,44,.28);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .4s}
  .modal.show{opacity:1;pointer-events:auto}
  .sheet{width:min(520px,100%);background:var(--paper);border-radius:22px;box-shadow:0 20px 60px rgba(40,25,10,.35);padding:26px 24px 22px;position:relative;transform:translateY(20px) scale(.96);transition:transform .5s cubic-bezier(.2,1.4,.4,1);text-align:center}
  .modal.show .sheet{transform:none}
  .sheet::before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(217,164,65,.45);border-radius:16px;pointer-events:none}
  .sheet h2{font-family:var(--serif);font-weight:900;margin:0 0 6px;font-size:20px;letter-spacing:.08em;color:var(--wood)}
  .sheet .q{font-size:18px;line-height:1.6;margin:10px 0 16px;font-weight:500}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{border:2px solid #e8d8bb;background:#fff;border-radius:14px;padding:12px 16px;font-size:16px;text-align:left;color:var(--ink);display:flex;gap:10px;align-items:center;transition:transform .15s,border-color .2s,background .2s}
  .opt:hover{border-color:var(--accent);transform:translateX(3px)}
  .opt .k{width:28px;height:28px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;font-weight:700;flex:none}
  .opt.wrong{border-color:#e7a19a;background:#fff3f1;animation:shake .4s}
  .opt.right{border-color:#7cbf8e;background:#f0fbf2}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fb{min-height:24px;margin-top:12px;color:var(--ink-soft);font-size:15px}
  .sheet .foot{margin-top:14px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .badgeArt{width:130px;height:130px;margin:6px auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#e9b654 60%,#c48a2c);display:grid;place-items:center;box-shadow:0 10px 30px rgba(217,164,65,.55),inset 0 -6px 0 rgba(0,0,0,.12);animation:spinIn 1s cubic-bezier(.2,1.4,.4,1)}
  .badgeArt svg{width:76px;height:76px}
  @keyframes spinIn{from{transform:rotateY(180deg) scale(.3)}to{transform:none}}
  .sheet .desc{color:var(--ink-soft);line-height:1.7;font-size:15px}

  /* ---------- Start overlay ---------- */
  #start{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(251,244,230,.82),rgba(233,214,180,.95));cursor:pointer;transition:opacity .9s}
  #start.gone{opacity:0;pointer-events:none}
  #start .inner{text-align:center;padding:24px}
  #start h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,7vw,64px);margin:0;letter-spacing:.15em;color:#6b3f24;text-shadow:0 3px 0 rgba(255,255,255,.6)}
  #start p{margin:10px 0 0;color:var(--ink-soft);font-size:16px;letter-spacing:.08em}
  #start .go{display:inline-block;margin-top:28px;padding:12px 30px;border-radius:999px;background:#c8443c;color:#fff;font-weight:700;letter-spacing:.2em;box-shadow:0 6px 0 #8f2c26;animation:pulse 1.8s infinite}
  #start .small{font-size:13px;margin-top:18px;opacity:.8}
  #loadErr{color:#b3362e;margin-top:14px;font-size:14px}

  body.locked .lockable{opacity:.45;pointer-events:none}
  body.locked #scene{cursor:progress}

  @media (max-width:600px){
    #brand .txt{display:none}
    .iconbtn .lbl{display:none}
    #chapter{top:max(64px,calc(env(safe-area-inset-top) + 56px));padding:6px 14px}
    #dialog{padding:12px 16px}
    #shelfBar .tip{font-size:13px;padding:6px 14px}
    #shelfBar .row{flex-wrap:nowrap;gap:8px}
    .bookBtn{flex:1 1 0;min-width:0;flex-direction:column;text-align:center;gap:6px;padding:10px 6px;position:relative}
    .bookBtn b{font-size:14px;letter-spacing:0}
    .bookBtn small{display:none}
    .bookBtn .medal{position:absolute;top:6px;right:6px;margin:0}
  }
</style>
</head>
<body data-book="0" data-state="BOOKSHELF">
<canvas id="scene"></canvas>
<canvas id="trail"></canvas>

<div id="topbar">
  <div id="brand"><span class="seal">三</span><span class="txt">三國志・立體繪本</span><span id="badges"></span></div>
  <div id="tools">
    <button class="iconbtn lockable hidden" id="btnFree" title="自由視角"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3c5 0 9 4 10 9-1 5-5 9-10 9S3 17 2 12c1-5 5-9 10-9z"/></svg><span class="lbl">自由視角</span></button>
    <button class="iconbtn lockable hidden" id="btnShelf" title="回到書架"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M9 4v16M14 5l4 15M3 20h18"/></svg><span class="lbl">回書架</span></button>
    <button class="iconbtn" id="btnMute" title="音樂開關" aria-label="音樂開關"></button>
  </div>
</div>

<div id="chapter" class="off"><div class="bk"></div><div class="ac"></div><div class="dots"></div></div>

<div id="dialog" class="off">
  <div id="speaker" class="narr">旁白</div>
  <div id="dlgText"></div>
  <div id="hint"></div>
  <div id="actions"></div>
</div>

<div id="shelfBar" class="off">
  <div class="tip">歡迎來到三國書房！挑一本立體書，一起翻開歷史的故事吧 📖</div>
  <div class="row" id="bookBtns"></div>
</div>

<div class="modal" id="quizModal">
  <div class="sheet">
    <h2>✎ 小小測驗</h2>
    <div class="q" id="quizQ"></div>
    <div class="opts" id="quizOpts"></div>
    <div class="fb" id="quizFb"></div>
    <div class="foot"><button class="btn ghost lockable" id="quizLater">先回書架</button></div>
  </div>
</div>

<div class="modal" id="badgeModal">
  <div class="sheet">
    <h2>🎉 恭喜獲得徽章</h2>
    <div class="badgeArt" id="badgeArt"></div>
    <div style="font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.12em" id="badgeName"></div>
    <p class="desc" id="badgeDesc"></p>
    <div class="foot">
      <button class="btn ghost lockable" id="btnReread">再讀一次</button>
      <button class="btn lockable" id="btnHome">回到書架</button>
    </div>
  </div>
</div>

<div id="start">
  <div class="inner">
    <h1>三國志立體繪本</h1>
    <p>桃園三結義 ・ 草船借箭 ・ 空城計</p>
    <div class="go" id="startGo">點一下，翻開故事</div>
    <p class="small">🎵 本作品含柔和音樂與音效，建議開啟聲音</p>
    <div id="loadErr"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
'use strict';

if (!window.THREE || !window.gsap) {
  document.getElementById('loadErr').textContent = '無法載入 Three.js 或 GSAP，請確認網路連線後重新整理頁面。';
  document.getElementById('startGo').textContent = '載入失敗';
  return;
}

/* =====================================================================
 *  0. 小工具
 * ===================================================================== */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const wait = ms => new Promise(r => setTimeout(r, ms));
const tweenP = (target, vars) => new Promise(res => { gsap.to(target, Object.assign({}, vars, { onComplete: res })); });
const FONT_SERIF = '"Noto Serif TC","Songti TC","PMingLiU","Microsoft JhengHei",serif';
const FONT_SANS = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 私密模式等情況下忽略 */ } }
};

/* =====================================================================
 *  1. Web Audio 合成音效與音樂
 * ===================================================================== */
const Sound = (() => {
  let ctx = null, master, musicBus, sfxBus, reverbSend, noiseBuf, timer = null;
  let muted = store.get('tk_muted', false);
  let nextTime = 0, step = 0, melIdx = 4, mood = 0;
  const ksCache = {};
  const MOODS = [
    { root: 0, tempo: 74 },   // 書房
    { root: 0, tempo: 78 },   // 桃園
    { root: -3, tempo: 68 },  // 江上
    { root: -5, tempo: 62 }   // 空城
  ];
  const PENTA = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81];
  const CHORDS = [48, 45, 41, 43];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function makeImpulse(sec) {
    const sr = ctx.sampleRate, len = sr * sec, buf = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    return buf;
  }
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(comp);
    const reverb = ctx.createConvolver(); reverb.buffer = makeImpulse(2.6);
    const revOut = ctx.createGain(); revOut.gain.value = 0.42;
    reverb.connect(revOut); revOut.connect(master);
    reverbSend = reverb;
    musicBus = ctx.createGain(); musicBus.gain.value = 0.26;
    musicBus.connect(master); musicBus.connect(reverb);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.75;
    sfxBus.connect(master);
    const sfxRev = ctx.createGain(); sfxRev.gain.value = 0.18; sfxBus.connect(sfxRev); sfxRev.connect(reverb);
    const len = ctx.sampleRate * 1.5;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 60);
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else ctx.resume();
    });
  }
  const ready = () => ctx && ctx.state !== 'closed';

  function tone(o) {
    if (!ready()) return;
    const t = o.t != null ? o.t : ctx.currentTime;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t);
    if (o.glideTo) osc.frequency.exponentialRampToValueAtTime(o.glideTo, t + (o.glideTime || o.d * 0.6));
    if (o.detune) osc.detune.value = o.detune;
    const a = o.a || 0.008, d = o.d || 0.3, v = o.vol || 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    let node = osc;
    if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
    node.connect(g); g.connect(o.bus || sfxBus);
    osc.start(t); osc.stop(t + a + d + 0.05);
  }
  function noise(o) {
    if (!ready()) return;
    const t = o.t != null ? o.t : ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1200, t);
    if (o.fTo) f.frequency.exponentialRampToValueAtTime(o.fTo, t + o.dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain(), a = o.a || 0.01, v = o.vol || 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(o.bus || sfxBus);
    src.start(t, Math.random() * 0.5); src.stop(t + o.dur + 0.05);
  }
  // Karplus-Strong 撥弦（古琴）
  function ksBuffer(freq, dur) {
    const key = freq.toFixed(1);
    if (ksCache[key]) return ksCache[key];
    const sr = ctx.sampleRate, N = Math.max(2, Math.round(sr / freq)), len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0), ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    for (let i = 0; i < len; i++) {
      const k = i % N, nk = (i + 1) % N;
      d[i] = ring[k];
      ring[k] = 0.4985 * (ring[k] + ring[nk]);
    }
    ksCache[key] = buf;

let currentAct = null;
function createAct() {
  return { group: new THREE.Group(), updaters: [], tweens: [], targets: [], chibis: [], fog: [], data: {}, done: false };
}
function addChibi(act, ch, p, ry = 0) {
  ch.group.position.set(p[0], p[1] || 0.04, p[2]);
  ch.group.rotation.y = ry;
  act.group.add(ch.group);
  act.chibis.push(ch);
  return ch;
}
function addTarget(act, obj, handler, markAt) {
  obj.userData.isTarget = true;
  act.targets.push({ obj, handler, markAt, enabled: false });
}
function loopTween(act, target, vars) { const tw = gsap.to(target, Object.assign({ repeat: -1, yoyo: true, ease: 'sine.inOut' }, vars)); act.tweens.push(tw); return tw; }

function popIn(act) {
  const items = act.group.children.filter(o => !o.userData.noPop);
  const tl = gsap.timeline();
  items.forEach((o, i) => {
    const s = o.scale.clone(), rx = o.rotation.x, mode = o.userData.pop || 'rise';
    const at = i * 0.07;
    if (mode === 'grow') {
      o.scale.set(s.x * 0.05, s.y, s.z * 0.05);
      tl.to(o.scale, { x: s.x, z: s.z, duration: 0.7, ease: 'power3.out' }, at);
    } else {
      o.scale.set(s.x * 0.6, s.y * 0.6, s.z * 0.6);
      o.rotation.x = rx - Math.PI / 2;
      tl.to(o.rotation, { x: rx, duration: mode === 'fold' ? 1.0 : 0.85, ease: mode === 'fold' ? 'back.out(1.2)' : 'back.out(2.2)' }, at);
      tl.to(o.scale, { x: s.x, y: s.y, z: s.z, duration: 0.8, ease: 'elastic.out(1,0.55)' }, at);
    }
    if (i < 10 && mode !== 'grow') tl.call(() => Sound.play('pop', 0.8 + Math.random() * 0.5), null, at + 0.12);
  });
  act.fog.forEach(sp => { const op = sp.userData.baseOp; sp.material.opacity = 0; tl.to(sp.material, { opacity: op, duration: 1.5 }, 0.3); });
  return new Promise(r => tl.eventCallback('onComplete', r));
}
function flattenOut(act) {
  act.tweens.forEach(t => t.kill());
  act.tweens.length = 0;
  hideMarker();
  const items = act.group.children.slice();
  const tl = gsap.timeline();
  items.forEach((o, i) => {
    gsap.killTweensOf(o.position); gsap.killTweensOf(o.rotation); gsap.killTweensOf(o.scale);
    if (o.isSprite) { tl.to(o.material, { opacity: 0, duration: 0.4 }, 0); return; }
    tl.to(o.scale, { y: 0.001, z: 0.001, x: o.scale.x * 1.06, duration: 0.55, ease: 'power2.in' }, i * 0.025);
  });
  Sound.play('whoosh');
  return new Promise(r => tl.eventCallback('onComplete', () => {
    try {
      STAGE.remove(act.group);
      act.group.traverse(o => { gsap.killTweensOf(o); if (o.position) gsap.killTweensOf(o.position); if (o.rotation) gsap.killTweensOf(o.rotation); if (o.scale) gsap.killTweensOf(o.scale); });
      disposeTree(act.group);
    } catch (e) { console.warn(e); }
    r();
  }));
}

function adjShot(shot) {
  const a = camera.aspect, k = (a < 1.25 ? Math.min(2.1, 1.25 / a) : 1) * 1.08;
  const L = new THREE.Vector3(...shot.look), P = new THREE.Vector3(...shot.pos);

}
function moveCamera(shot, dur = 1.8, ease = 'power2.inOut') {

  return Promise.all([
    tweenP(camera.position, { x: s.pos.x, y: s.pos.y, z: s.pos.z, duration: dur, ease }),
    tweenP(camTarget, { x: s.look.x, y: s.look.y, z: s.look.z, duration: dur, ease })

}

const ui = {

};
let typingToken = 0;
function say(name, text, hold = 900) {
  const token = ++typingToken;
  ui.dialog.classList.remove('off');
  ui.speaker.textContent = name || '旁白';
  ui.speaker.classList.toggle('narr', !name || name === '旁白');
  ui.text.textContent = '';
  const chars = Array.from(text);
  return new Promise(res => {
    let i = 0;
    const tick = () => {
      if (token !== typingToken) return res();
      ui.text.textContent += chars[i++] || '';
      if (i < chars.length) setTimeout(tick, 38);
      else setTimeout(res, hold);
    };
    tick();
  });
}

let books = [], activeBook = null, actIdx = 0, started = false;
const medals = {};

if (!Array.isArray(earned)) earned = [];

function renderBadges() {
  $('badges').innerHTML = BOOKS.map((b, i) => `<span class="b ${earned.includes(i) ? 'got' : ''}" title="${b.badge.name}">${b.badge.svg}</span>`).join('');
  $('bookBtns').innerHTML = BOOKS.map((b, i) => `<button class="bookBtn lockable" data-i="${i}"><span class="sw" style="background:linear-gradient(135deg,${b.coverA},${b.coverB})"></span><span><b>《${b.title}》</b><small>卷${b.volume}・${b.tagline}</small></span>${earned.includes(i) ? `<span class="medal">${b.badge.svg}</span>` : ''}</button>`).join('');
  $('bookBtns').querySelectorAll('.bookBtn').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); if (isLocked()) return; Sound.play('click'); openBook(+btn.dataset.i); }));
}

async function enterAct(i) {
  actIdx = i;
  const def = activeBook.def.acts[i];
  const act = createAct(); act.def = def;
  currentAct = act;
  def.build(act);
  STAGE.add(act.group);
  setChapter(activeBook, i);
  setActions([]); setHint('');
  const camP = moveCamera(def.shot, 2.0);
  await popIn(act);
  await camP;
  await def.intro(act);
  act.targets.forEach(t => { t.enabled = true; });
  if (act.targets[0]) showMarker(act.targets[0].obj, act.targets[0].markAt);
  setHint(def.hint);
}
async function runTarget(t) {
  await guarded(async () => {
    t.enabled = false;
    hideMarker(); setHint('');
    await t.handler();
    currentAct.done = true;
    const last = actIdx === activeBook.def.acts.length - 1;
    setHint(last ? '故事讀完囉！來挑戰小測驗吧。' : '這一幕完成了！可以翻到下一頁，或開啟「自由視角」慢慢欣賞。');
    setActions([last ? { label: '開始小測驗 ✎', fn: startQuiz, cls: 'pulse' } : { label: '翻到下一頁 ▶', fn: nextPage, cls: 'pulse' }]);
  });
}

async function openBook(i) {
  if (state !== S.BOOKSHELF) return;
  await guarded(async () => {
    if (!setState(S.BOOK_ZOOM)) return;
    activeBook = books[i];
    document.body.dataset.book = i;
    Sound.setMood(activeBook.def.mood);
    Sound.play('click');
    const r = activeBook.root;
    gsap.killTweensOf(r.position); gsap.killTweensOf(r.rotation); gsap.killTweensOf(r.scale);
    await say('旁白', `《${activeBook.def.title}》——${activeBook.def.tagline}。`, 0);
    setHint('');
    const tl = gsap.timeline();
    tl.to(r.position, { z: SHELF.z + 1.6, y: r.position.y + 0.2, duration: 0.55, ease: 'power2.out' })
      .to(r.position, { x: 0, z: DESK.z, duration: 1.5, ease: 'power2.inOut' })
      .to(r.position, { y: 3.4, duration: 0.6, ease: 'sine.out' }, '<')
      .to(r.position, { y: 0, duration: 0.9, ease: 'power2.in' }, '>-0.02')
      .to(r.rotation, { x: 0, duration: 1.4, ease: 'power2.inOut' }, 0.6)
      .to(r.scale, { x: 1, y: 1, z: 1, duration: 1.4, ease: 'power2.inOut' }, 0.6)
      .call(() => Sound.play('step'), null, '>');
    const camP = (async () => { await wait(350); await moveCamera(SHOTS.desk, 2.0); })();
    await new Promise(res => tl.eventCallback('onComplete', res));
    await camP;
    setState(S.OPEN_COVER);
    Sound.play('flip');
    await Promise.all([
      tweenP(activeBook.pivot.rotation, { z: Math.PI, duration: 1.5, ease: 'power2.inOut' }),
      tweenP(r.position, { x: BK.W / 2, duration: 1.5, ease: 'power2.inOut' }),
      moveCamera(SHOTS.open, 1.6)
    ]);
    setState(S.SCENE_INTERACTION);
    await enterAct(0);
  });
}

  piv.add(page);
  book.inner.add(piv);
  Sound.play('flip');
  const o = { t: 0 };
  return tweenP(o, {
    t: 1, duration: 1.15, ease: 'power2.inOut',
    onUpdate: () => { piv.rotation.z = o.t * Math.PI; piv.position.y = BK.top + 0.01 + Math.sin(o.t * Math.PI) * 0.05; page.rotation.y = Math.sin(o.t * Math.PI) * 0.12; }
  }).then(() => { book.inner.remove(piv); page.geometry.dispose(); page.material.dispose(); });
}
function nextPage() {
  guarded(async () => {
    if (!setState(S.PAGE_TURN)) return;
    setActions([]); setHint('');
    await flattenOut(currentAct);
    currentAct = null;
    await moveCamera(SHOTS.open, 0.9);
    await flipPage(activeBook);
    setState(S.SCENE_INTERACTION);
    await enterAct(actIdx + 1);
  });
}
function startQuiz() {
  guarded(async () => {
    if (!setState(S.QUIZ)) return;
    setActions([]); setHint('');
    setChapter(activeBook, actIdx);
    await say('旁白', '故事說完了，來考考你吧！', 200);
    const q = activeBook.def.quiz;
    $('quizQ').textContent = q.q;
    $('quizFb').textContent = '';
    const opts = $('quizOpts'); opts.innerHTML = '';
    q.options.forEach((op, k) => {
      const b = document.createElement('button');
      b.className = 'opt lockable';
      b.innerHTML = `<span class="k">${'AB'[k]}</span><span>${op.t}</span>`;
      b.addEventListener('click', e => { e.stopPropagation(); answer(op, b, e); });
      opts.appendChild(b);
    });
    $('quizModal').classList.add('show');
  });
}
function answer(op, btn, e) {
  if (isLocked() || state !== S.QUIZ) return;
  if (!op.ok) {
    Sound.play('wrong');
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    $('quizFb').textContent = activeBook.def.quiz.wrongTip;
    return;
  }
  guarded(async () => {
    btn.classList.add('right');
    Sound.play('chime');
    Trail.burst(e.clientX, e.clientY, 26);
    $('quizFb').textContent = '答對了！你真是個小小智多星 ✨';
    await wait(1000);
    $('quizModal').classList.remove('show');
    setState(S.ENDING);
    const i = activeBook.idx;
    if (!earned.includes(i)) { earned.push(i); store.set('tk_badges', earned); }
    renderBadges();
    const bd = activeBook.def.badge;
    $('badgeArt').innerHTML = bd.svg;
    $('badgeName').textContent = `「${bd.name}」徽章`;
    $('badgeDesc').textContent = bd.desc;
    await wait(300);
    $('badgeModal').classList.add('show');
    Sound.play('fanfare');
    Trail.confetti(140);
    say('旁白', `恭喜你讀完《${activeBook.def.title}》，獲得「${bd.name}」徽章！`, 0);
    await wait(900);
  });
}
function goShelf() {
  if (!activeBook || state === S.BOOKSHELF) return;
  guarded(async () => {
    $('quizModal').classList.remove('show');
    $('badgeModal').classList.remove('show');
    setActions([]); setHint('');
    if (currentAct) { await flattenOut(currentAct); currentAct = null; }
    const r = activeBook.root, book = activeBook;
    setChapter(null);
    ui.dialog.classList.add('off');
    Sound.play('flip');
    await Promise.all([
      tweenP(book.pivot.rotation, { z: 0, duration: 1.2, ease: 'power2.inOut' }),
      tweenP(r.position, { x: 0, duration: 1.2, ease: 'power2.inOut' }),
      moveCamera(SHOTS.desk, 1.2)
    ]);
    const h = book.home;
    const tl = gsap.timeline();
    tl.to(r.position, { y: 3.0, duration: 0.6, ease: 'sine.out' })
      .to(r.position, { x: h.pos.x, z: h.pos.z + 1.5, y: h.pos.y + 0.2, duration: 1.3, ease: 'power2.inOut' })
      .to(r.rotation, { x: h.rot.x, duration: 1.3, ease: 'power2.inOut' }, 0.3)
      .to(r.scale, { x: h.scale, y: h.scale, z: h.scale, duration: 1.3, ease: 'power2.inOut' }, 0.3)
      .to(r.position, { z: h.pos.z, y: h.pos.y, duration: 0.5, ease: 'power2.out' });
    const camP = moveCamera(SHOTS.shelf, 2.2);
    await new Promise(res => tl.eventCallback('onComplete', res));
    await camP;
    Sound.play('step');
    if (earned.includes(book.idx) && !medals[book.idx]) {
      const m = makeMedal(book); medals[book.idx] = m;
      m.scale.setScalar(0.001);
      Sound.play('chime');
      await tweenP(m.scale, { x: 0.8, y: 0.8, z: 0.8, duration: 0.8, ease: 'elastic.out(1,0.5)' });
    }
    setState(S.BOOKSHELF);
    activeBook = null;
    Sound.setMood(0);
    ui.dialog.classList.add('off');
  });
}
function reread() {
  guarded(async () => {
    $('badgeModal').classList.remove('show');
    if (!setState(S.PAGE_TURN)) return;
    setActions([]); setHint('');
    if (currentAct) { await flattenOut(currentAct); currentAct = null; }
    await moveCamera(SHOTS.open, 0.9);
    await flipPage(activeBook);
    setState(S.SCENE_INTERACTION);
    await enterAct(0);
  });
}

/* =====================================================================
 * 13. 指標事件 & Raycaster
 * ===================================================================== */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downPos = null, hoverBook = null;
function setNDC(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); }
function hitBook() {
  const hits = ray.intersectObjects(books.map(b => b.root), true);
  return hits.length ? books[hits[0].object.userData.bookIdx] : null;
}
function hitTarget() {
  if (!currentAct) return null;
  const live = currentAct.targets.filter(t => t.enabled);
  if (!live.length) return null;
  const hits = ray.intersectObjects(live.map(t => t.obj), true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o) { const t = live.find(t => t.obj === o); if (t) return t; o = o.parent; }
  return null;
}
function hitChibi() {
  if (!currentAct) return null;
  const hits = ray.intersectObjects(currentAct.chibis.map(c => c.group), true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o) { if (o.userData.chibi) return o.userData.chibi; o = o.parent; }
  return null;
}
canvas.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 6 || !started || isLocked()) return;
  setNDC(e);
  if (state === S.BOOKSHELF) {
    const b = hitBook();
    if (b) { Trail.burst(e.clientX, e.clientY, 14); openBook(b.idx); }
  } else if (state === S.SCENE_INTERACTION) {
    const t = hitTarget();
    if (t) { Trail.burst(e.clientX, e.clientY, 16); Sound.play('click'); runTarget(t); return; }
    const ch = hitChibi();
    if (ch) { Trail.burst(e.clientX, e.clientY, 10, [330, 45]); boing(ch); }
  }
});
let lastMove = null;
canvas.addEventListener('pointermove', e => { lastMove = e; });
function updateHover() {
  if (!lastMove || !started) return;
  let cursor = 'default';
  if (!isLocked()) {
    setNDC(lastMove);
    if (state === S.BOOKSHELF) {
      const b = hitBook();
      if (b !== hoverBook) {
        if (hoverBook) gsap.to(hoverBook.root.position, { z: hoverBook.home.pos.z, duration: 0.35, ease: 'power2.out' });
        if (b) { gsap.to(b.root.position, { z: b.home.pos.z + 0.35, duration: 0.35, ease: 'back.out(2)' }); Sound.play('pop', 1.6); }
        hoverBook = b;
      }
      if (b) cursor = 'pointer';
    } else {
      if (hoverBook) { gsap.to(hoverBook.root.position, { z: hoverBook.home.pos.z, duration: 0.3 }); hoverBook = null; }
      if (state === S.SCENE_INTERACTION && (hitTarget() || hitChibi())) cursor = 'pointer';
      else if (freeView) cursor = 'grab';
    }
  } else if (hoverBook && state !== S.BOOKSHELF) hoverBook = null;
  canvas.style.cursor = cursor;
}

/* ---------- 按鈕 ---------- */
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
function renderMute() { $('btnMute').innerHTML = Sound.isMuted() ? ICON_OFF : ICON_ON; $('btnMute').title = Sound.isMuted() ? '播放音樂' : '靜音'; }
$('btnMute').addEventListener('click', e => { e.stopPropagation(); Sound.init(); Sound.toggleMute(); renderMute(); Sound.play('click'); });
$('btnShelf').addEventListener('click', e => { e.stopPropagation(); if (isLocked()) return; Sound.play('click'); goShelf(); });
$('btnFree').addEventListener('click', e => {
  e.stopPropagation();
  if (isLocked() || state !== S.SCENE_INTERACTION) return;
  Sound.play('click');
  setFreeView(!freeView);
  if (!freeView) moveCamera(currentShot, 1.0);
});
$('quizLater').addEventListener('click', e => { e.stopPropagation(); if (isLocked()) return; Sound.play('click'); goShelf(); });
$('btnHome').addEventListener('click', e => { e.stopPropagation(); if (isLocked()) return; Sound.play('click'); goShelf(); });
$('btnReread').addEventListener('click', e => { e.stopPropagation(); if (isLocked()) return; Sound.play('click'); reread(); });
document.addEventListener('pointerdown', () => Sound.init(), { once: false, passive: true });

/* =====================================================================
 * 14. 啟動 & 渲染迴圈
 * ===================================================================== */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (!isLocked() && !freeView) snapCamera(currentShot);
}
addEventListener('resize', onResize);

const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  if (currentAct) {
    currentAct.updaters.forEach(fn => fn(dt, t));
    currentAct.chibis.forEach(ch => { ch.inner.position.y = Math.abs(Math.sin(t * 2 + ch.phase)) * 0.025; ch.inner.scale.y = 1 + Math.sin(t * 2.4 + ch.phase) * 0.012; });
  }
  if (marker.visible) { marker.position.y = markerBase.y + Math.sin(t * 3) * 0.08; marker.rotation.y += dt * 2; }
  for (const k in medals) { const c = medals[k].userData.coin; c.rotation.z = Math.sin(t * 1.2 + +k) * 0.4; }
  updateHover();
  if (controls.enabled) controls.update(); else camera.lookAt(camTarget);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

async function boot() {
  try { if (document.fonts && document.fonts.load) await Promise.race([Promise.all([document.fonts.load(`900 40px "Noto Serif TC"`, '三國志桃園結義草船借箭空城計'), document.fonts.load(`500 20px "Noto Sans TC"`, '三國')]), wait(2500)]); } catch (e) { /* 字型載入失敗時使用系統字型 */ }
  books = BOOKS.map((d, i) => makeBook(d, i));
  earned.forEach(i => { if (books[i]) medals[i] = makeMedal(books[i]); });
  renderBadges(); renderMute();
  snapCamera(SHOTS.intro);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  loop();
  $('start').addEventListener('click', () => {
    if (started) return;
    Sound.init();
    Sound.play('chime');
    $('start').classList.add('gone');
    guarded(async () => {
      started = true;
      await moveCamera(SHOTS.shelf, 2.6);
      refreshUI();
    });
  });
}
boot();

// 除錯/自動測試用介面（不影響一般使用）
window.TK = {
  get state() { return state; }, get locked() { return isLocked(); }, get actIdx() { return actIdx; },
  openBook, nextPage, startQuiz, goShelf,
  clickTarget() { if (currentAct) { const t = currentAct.targets.find(t => t.enabled); if (t && !isLocked()) { runTarget(t); return true; } } return false; },
  answer(correct) { const q = activeBook.def.quiz; const k = q.options.findIndex(o => o.ok === correct); const btn = $('quizOpts').children[k]; answer(q.options[k], btn, { clientX: innerWidth / 2, clientY: innerHeight / 2 }); }
};
})();
</script>
