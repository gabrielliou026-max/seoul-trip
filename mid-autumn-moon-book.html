<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中秋月光立體繪本</title>
<style>
  :root{
    --paper:#fbf5e8; --paper2:#f2e6cc; --ink:#3a3150; --ink2:#6c6282;
    --gold:#e6b44e; --gold2:#fbe3a0;
    --accent:#a9bdf0; --accent-ink:#253a7a;
    --glass:rgba(16,20,54,.74); --line:rgba(251,227,160,.28);
    --shadow:0 14px 34px rgba(6,10,34,.45),0 3px 8px rgba(6,10,34,.25);
    --r:18px;
    --serif:"Noto Serif TC","Songti TC","PMingLiU","MingLiU","SimSun",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  }
  body[data-book="0"]{--accent:#a9bdf0;--accent-ink:#253a7a}
  body[data-book="1"]{--accent:#f2c860;--accent-ink:#7a5410}
  body[data-book="2"]{--accent:#8fcfa7;--accent-ink:#2e5a44}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f2c;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
  button{font-family:inherit;cursor:pointer;border:none}
  .hidden{display:none!important}

  /* ---------- 頂部列 ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 0;z-index:20;pointer-events:none}
  #brand{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:7px 16px 7px 8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fbeec8;box-shadow:var(--shadow);border:1px solid var(--line);font-family:var(--serif);font-weight:900;letter-spacing:.12em;font-size:15px;white-space:nowrap}
  #brand .mn{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffbe8,#f7dc8e 60%,#e3b95a);box-shadow:0 0 14px rgba(255,220,130,.8);flex:none}
  #right{display:flex;gap:8px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
  #badgeBar{display:flex;gap:6px;padding:5px 10px;border-radius:999px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:var(--shadow);align-items:center}
  #badgeBar .lbl{color:#fbeec8;font-size:12px;letter-spacing:.1em;margin-right:2px}
  .slot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px dashed rgba(251,227,160,.4);transition:background .5s,box-shadow .5s,border .5s}
  .slot svg{width:20px;height:20px;opacity:.28;filter:grayscale(1);transition:.5s}
  .slot.got{background:radial-gradient(circle at 35% 30%,#fff3c4,#e6b44e);border:1px solid #fff0b8;box-shadow:0 0 14px rgba(246,205,104,.75)}
  .slot.got svg{opacity:1;filter:none}
  .slot.pop{animation:slotPop .9s cubic-bezier(.3,1.6,.5,1)}
  @keyframes slotPop{0%{transform:scale(.2) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
  .icon-btn{height:44px;min-width:44px;padding:0 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fbeec8;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;transition:transform .2s,opacity .3s,background .2s}
  .icon-btn:hover{transform:translateY(-2px);background:rgba(40,46,100,.88)}
  .icon-btn svg{width:20px;height:20px;flex:none}
  #btnMute{width:44px;padding:0}
  .icon-btn[disabled]{opacity:.3;pointer-events:none}

  /* ---------- 章節卡（上方） ---------- */
  #chapter{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:15;padding:7px 22px 9px;border-radius:14px;background:linear-gradient(180deg,rgba(251,245,232,.95),rgba(242,230,204,.95));box-shadow:var(--shadow);text-align:center;transition:opacity .5s,transform .5s;border:2px solid rgba(255,255,255,.6);max-width:calc(100vw - 32px);pointer-events:none}
  #chapter.off{opacity:0;transform:translate(-50%,-14px)}
  #chBook{font-family:var(--serif);font-weight:900;font-size:16px;letter-spacing:.12em;color:var(--accent-ink)}
  #chAct{font-size:13px;color:var(--ink2);margin-top:1px}
  #chDots{display:flex;gap:7px;justify-content:center;margin-top:5px}
  #chDots i{width:8px;height:8px;border-radius:50%;background:#dccdb2;transition:.3s}
  #chDots i.on{background:var(--accent-ink);transform:scale(1.3)}
  #chDots i.done{background:var(--gold)}

  /* ---------- 對話框（下方） ---------- */
  .card-paper{background:linear-gradient(180deg,rgba(251,245,232,.97),rgba(242,230,204,.97));border-radius:var(--r);box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.7)}
  #dialog{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100vw - 32px));z-index:15;padding:12px 20px 12px;transition:opacity .45s,transform .45s}
  #dialog.off,#shelfPanel.off{opacity:0;transform:translate(-50%,26px);pointer-events:none}
  #dialog::before{content:"";position:absolute;left:18px;right:18px;top:6px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
  .who{display:inline-block;background:var(--accent-ink);color:#fff6dc;font-family:var(--serif);font-weight:900;padding:3px 12px;border-radius:999px;font-size:13px;letter-spacing:.14em;margin-top:4px}
  #dText{margin:6px 0 4px;font-size:clamp(15px,2vw,17px);line-height:1.7;min-height:1.7em;color:var(--ink)}
  @media (max-height:640px){#dText{font-size:14px;line-height:1.6}#dialog{padding:8px 16px}.drow{min-height:34px}.primary{padding:8px 18px}}
  .drow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px}
  #dHint{font-size:14px;color:var(--accent-ink);font-weight:700;display:flex;align-items:center;gap:6px}
  #dHint:not(:empty)::before{content:"✦";color:var(--gold);font-size:16px;animation:twinkle 1.4s infinite}
  @keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}
  .primary{background:linear-gradient(180deg,#f7d57a,#e0a93c);color:#4a3210;font-weight:700;padding:10px 22px;border-radius:999px;font-size:15px;box-shadow:0 6px 16px rgba(224,169,60,.45),inset 0 -2px 0 rgba(0,0,0,.12);transition:transform .2s,opacity .3s;margin-left:auto}
  .primary:hover{transform:translateY(-2px) scale(1.03)}
  .primary.pulse{animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 16px rgba(224,169,60,.45),0 0 0 0 rgba(246,205,104,.6)}50%{box-shadow:0 6px 16px rgba(224,169,60,.45),0 0 0 10px rgba(246,205,104,0)}}
  body.locked .needs-unlock{opacity:.45;pointer-events:none}

  /* ---------- 書架面板 ---------- */
  #shelfPanel{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(820px,calc(100vw - 32px));z-index:15;padding:12px 14px 14px;transition:opacity .45s,transform .45s}
  .sp-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 4px 10px;flex-wrap:wrap}
  .sp-head h2{margin:0;font-family:var(--serif);font-size:18px;letter-spacing:.12em;color:#2b2448}
  .sp-head p{margin:0;color:var(--ink2);font-size:13px}
  .sp-books{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .bookbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(58,49,80,.12);text-align:left;color:var(--ink);transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;border:2px solid transparent}
  .bookbtn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(58,49,80,.2);border-color:var(--c)}
  .bookbtn .cv{width:34px;height:46px;border-radius:4px 7px 7px 4px;background:var(--c);box-shadow:inset 5px 0 0 rgba(0,0,0,.2);display:grid;place-items:center;flex:none}
  .bookbtn .cv svg{width:20px;height:20px}
  .bookbtn b{font-family:var(--serif);font-size:16px;display:block;letter-spacing:.06em}
  .bookbtn small{color:var(--ink2);font-size:12px}
  .bookbtn .done{position:absolute;top:-9px;right:-6px;background:linear-gradient(#fff0b8,#e6b44e);color:#5a3a08;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.2);display:none}
  .bookbtn.got .done{display:block}
  @media (max-width:900px){#chapter{top:calc(max(12px,env(safe-area-inset-top)) + 56px)}}
  @media (max-width:640px){
    .sp-books{gap:6px}
    .bookbtn{flex-direction:column;text-align:center;gap:4px;padding:8px 4px}
    .bookbtn small{display:none}
    .bookbtn b{font-size:14px}
    #brand .txt{display:none}
    #brand{padding:7px}
    #badgeBar .lbl{display:none}
    #btnHome .txt{display:none}
    #btnHome{width:44px;padding:0}
  }

  /* ---------- 彈窗 ---------- */
  .modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,10,30,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s}
  .modal.show{opacity:1;pointer-events:auto}
  .modal .card{width:min(520px,calc(100vw - 32px));padding:22px 22px 18px;text-align:center;transform:translateY(24px) scale(.95);transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
  .modal.show .card{transform:none}
  .qtag{display:inline-block;padding:3px 14px;border-radius:999px;background:var(--accent-ink);color:#fff6dc;font-size:13px;letter-spacing:.16em;font-family:var(--serif);font-weight:900}
  .modal h2{font-family:var(--serif);font-size:clamp(19px,3.2vw,23px);line-height:1.5;margin:12px 0 4px;color:#2b2448}
  .opts{display:grid;gap:10px;margin-top:14px}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff;border:2px solid #eadfc6;font-size:16px;color:var(--ink);text-align:left;transition:transform .2s,border-color .2s,background .2s}
  .opt .k{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;flex:none}
  .opt:hover{border-color:var(--accent);transform:translateY(-2px)}
  .opt.right{background:#eaf7e6;border-color:#7cc38a}
  .opt.wrong{background:#fdecec;border-color:#e59a9a;animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  #qFb{min-height:1.6em;margin:12px 0 0;color:var(--ink2);font-size:14px;line-height:1.65}
  .badge-wrap{position:relative;width:170px;height:170px;margin:4px auto 6px;display:grid;place-items:center}
  .badge-wrap::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(246,205,104,.45) 0 10deg,transparent 10deg 20deg);animation:spin 9s linear infinite;mask:radial-gradient(circle,#000 35%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 35%,transparent 70%)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge-big{position:relative;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d0,#f2c95e 55%,#c98f2c);display:grid;place-items:center;box-shadow:0 0 0 7px rgba(255,240,190,.55),0 0 40px rgba(246,205,104,.9),inset 0 -6px 0 rgba(0,0,0,.12)}
  .modal.show .badge-big{animation:badgeIn 1.1s cubic-bezier(.3,1.5,.5,1)}
  @keyframes badgeIn{0%{transform:scale(.1) rotate(-200deg);opacity:0}100%{transform:none;opacity:1}}
  .badge-big svg{width:66px;height:66px}
  #bName{font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.2em;color:#7a5410;margin:6px 0 2px}
  #bDesc{color:var(--ink2);margin:0 0 16px;font-size:15px;line-height:1.6}
  .modal .primary{margin:0 auto}

  /* ---------- 開場 ---------- */
  #intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(30,38,90,.5),rgba(6,8,24,.92));cursor:pointer;transition:opacity 1s}
  #intro.bye{opacity:0;pointer-events:none}
  #intro .box{text-align:center;color:#fbeec8;padding:24px}
  #intro .bigmoon{width:118px;height:118px;border-radius:50%;margin:0 auto 22px;background:radial-gradient(circle at 38% 35%,#fffdf0,#f9e3a0 55%,#e8bf62);box-shadow:0 0 60px 12px rgba(255,220,130,.5);animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-10px)}}
  #intro h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,6vw,44px);letter-spacing:.2em;margin:0 0 8px;text-shadow:0 0 22px rgba(255,214,120,.6)}
  #intro p{margin:0;opacity:.85;font-size:15px;line-height:1.8}
  #intro .tap{margin-top:26px;display:inline-block;padding:10px 28px;border-radius:999px;border:1px solid rgba(251,227,160,.55);background:rgba(251,227,160,.08);animation:breathe 2.2s infinite;font-size:16px;letter-spacing:.12em}
  @keyframes breathe{50%{box-shadow:0 0 22px rgba(251,227,160,.5);background:rgba(251,227,160,.18)}}
  #intro .err{margin-top:18px;color:#ffb3a8;font-size:14px}

  /* ---------- 結局 ---------- */
  #ending{position:fixed;left:50%;top:max(96px,14vh);transform:translateX(-50%);z-index:16;text-align:center;color:#fff6d8;pointer-events:none;opacity:0;transition:opacity 2.2s;width:calc(100vw - 32px)}
  #ending.show{opacity:1}
  #ending h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,6.4vw,62px);letter-spacing:.14em;margin:0;text-shadow:0 0 26px rgba(255,214,120,.95),0 4px 18px rgba(0,0,0,.55)}
  #ending p{margin:10px 0 0;font-size:clamp(14px,2vw,17px);text-shadow:0 2px 10px rgba(0,0,0,.6);opacity:.95}
  #btnReplay{pointer-events:none;position:absolute;left:50%;top:calc(100vh - max(96px,14vh) - 110px);transform:translateX(-50%);opacity:0;transition:opacity .8s;white-space:nowrap}
  #ending.ready #btnReplay{opacity:1;pointer-events:auto}
  #ending:not(.show){visibility:hidden;transition:opacity 2.2s,visibility 0s 2.2s}
</style>
</head>
<body data-state="BOOKSHELF" class="locked">
<canvas id="scene"></canvas>
<canvas id="trail"></canvas>

<div id="topbar">
  <div id="brand"><span class="mn"></span><span class="txt">中秋月光・立體繪本</span></div>
  <div id="right">
    <div id="badgeBar" title="徽章收集">
      <span class="lbl">徽章</span>
      <div class="slot" data-b="0"><svg viewBox="0 0 24 24"><path d="M15.5 3.2a8.8 8.8 0 1 0 5.3 14.3A7.2 7.2 0 0 1 15.5 3.2z" fill="#fff6d6" stroke="#b98a2a" stroke-width="1.3"/></svg></div>
      <div class="slot" data-b="1"><svg viewBox="0 0 24 24"><rect x="11" y="1.8" width="3.2" height="12" rx="1.6" fill="#a86a3c" transform="rotate(18 12 8)"/><path d="M4.5 12.5h15l-2.2 7.2a2 2 0 0 1-1.9 1.4H8.6a2 2 0 0 1-1.9-1.4z" fill="#d8d0c2" stroke="#8a8070" stroke-width="1.1"/></svg></div>
      <div class="slot" data-b="2"><svg viewBox="0 0 24 24"><g fill="#f5b83a" stroke="#b27a12" stroke-width=".9"><ellipse cx="12" cy="6.6" rx="3.3" ry="4.6"/><ellipse cx="12" cy="17.4" rx="3.3" ry="4.6"/><ellipse cx="6.6" cy="12" rx="4.6" ry="3.3"/><ellipse cx="17.4" cy="12" rx="4.6" ry="3.3"/></g><circle cx="12" cy="12" r="2.5" fill="#fff1b8"/></svg></div>
    </div>
    <button id="btnHome" class="icon-btn" disabled title="回到書架"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M7 3v9M10 3v9M15 12v9M18 12v9"/></svg><span class="txt">回書架</span></button>
    <button id="btnMute" class="icon-btn" title="音樂開關" aria-label="音樂開關"><svg id="icoSound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" fill-opacity=".25"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><svg id="icoMute" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" fill-opacity=".25"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg></button>
  </div>
</div>

<div id="chapter" class="off"><div id="chBook"></div><div id="chAct"></div><div id="chDots"><i></i><i></i><i></i><i></i></div></div>

<div id="dialog" class="card-paper off">
  <span id="dWho" class="who">旁白</span>
  <p id="dText"></p>
  <div class="drow"><div id="dHint"></div><button id="btnNext" class="primary pulse needs-unlock hidden">翻到下一頁 ▶</button></div>
</div>

<div id="shelfPanel" class="card-paper off">
  <div class="sp-head"><h2>月光下的書架</h2><p>選一本立體書，聽聽月亮的故事吧！也可以直接點書架上的書喔。</p></div>
  <div class="sp-books">
    <button class="bookbtn needs-unlock" data-book="0" style="--c:#2d4a8f"><span class="cv"><svg viewBox="0 0 24 24"><path d="M15.5 3.2a8.8 8.8 0 1 0 5.3 14.3A7.2 7.2 0 0 1 15.5 3.2z" fill="#eef2ff"/></svg></span><span><b>嫦娥奔月</b><small>月光銀白・夜空深藍</small></span><span class="done">✓ 已獲徽章</span></button>
    <button class="bookbtn needs-unlock" data-book="1" style="--c:#d49a2a"><span class="cv"><svg viewBox="0 0 24 24"><ellipse cx="9" cy="6" rx="2" ry="5" fill="#fff"/><ellipse cx="15" cy="6" rx="2" ry="5" fill="#fff"/><circle cx="12" cy="15" r="6" fill="#fff"/></svg></span><span><b>玉兔搗藥</b><small>桂花金黃・暖白月色</small></span><span class="done">✓ 已獲徽章</span></button>
    <button class="bookbtn needs-unlock" data-book="2" style="--c:#2f6a50"><span class="cv"><svg viewBox="0 0 24 24"><rect x="11" y="12" width="2.4" height="10" fill="#e8c9a0"/><circle cx="12" cy="9" r="7" fill="#9fd8b2"/><circle cx="9" cy="8" r="1.2" fill="#ffd35a"/><circle cx="14" cy="6" r="1.2" fill="#ffd35a"/><circle cx="14.5" cy="11" r="1.2" fill="#ffd35a"/></svg></span><span><b>吳剛伐桂</b><small>桂樹墨綠・星空藍紫</small></span><span class="done">✓ 已獲徽章</span></button>
  </div>
</div>

<div id="quiz" class="modal">
  <div class="card card-paper">
    <span class="qtag">小小測驗</span>
    <h2 id="qText"></h2>
    <div class="opts" id="qOpts"></div>
    <p id="qFb"></p>
  </div>
</div>

<div id="badgeModal" class="modal">
  <div class="card card-paper">
    <span class="qtag">獲得徽章</span>
    <div class="badge-wrap"><div class="badge-big" id="bIcon"></div></div>
    <div id="bName"></div>
    <p id="bDesc"></p>
    <button id="btnCollect" class="primary">收下徽章，回到書架 ✦</button>
  </div>
</div>

<div id="ending">
  <h1>月圓人團圓，中秋節快樂！</h1>
  <p>謝謝你陪嫦娥、玉兔和吳剛，一起度過溫暖的中秋夜。</p>
  <button id="btnReplay" class="primary">再讀一次 ↺</button>
</div>

<div id="intro">
  <div class="box">
    <div class="bigmoon"></div>
    <h1>中秋月光立體繪本</h1>
    <p>三本會動的立體書，三個關於月亮的故事。<br>收集三枚徽章，一起迎接最圓的月亮！</p>
    <div class="tap">輕觸畫面，打開書架</div>
    <div class="err hidden" id="libErr">無法載入 3D 函式庫（Three.js / GSAP），請確認網路連線後重新整理。</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE || !window.gsap) {
  $('#libErr').classList.remove('hidden');
  $('#intro .tap').classList.add('hidden');
  return;
}

/* =========================================================
   小工具
   ========================================================= */
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const rand = (a, b) => a + Math.random() * (b - a);
const wait = s => new Promise(r => gsap.delayedCall(s, r));

/* =========================================================
   Web Audio：全部以程式碼合成
   ========================================================= */
const Sound = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, reverb = null, noiseBuf = null;
  let muted = false, ambTimer = null, ambNext = 0, ambStep = 0, melIdx = 7, root = 0, quietUntil = 0;
  const pad = [];
  const PENTA = [0, 2, 4, 7, 9];                      // 宮 商 角 徵 羽
  const f0 = s => 261.63 * Math.pow(2, s / 12);
  const pf = (i, r = root) => { const o = Math.floor(i / 5), d = ((i % 5) + 5) % 5; return f0(r + PENTA[d] + 12 * o); };

  function init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(comp);
    reverb = ctx.createConvolver(); reverb.buffer = impulse(3, 2.4);
    const rv = ctx.createGain(); rv.gain.value = 0.32; reverb.connect(rv); rv.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
    const ms = ctx.createGain(); ms.gain.value = 0.7; musicBus.connect(ms); ms.connect(reverb);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(master);
    const ss = ctx.createGain(); ss.gain.value = 0.22; sfxBus.connect(ss); ss.connect(reverb);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (ctx.state === 'suspended') ctx.resume();
    startAmbient();
  }
  function impulse(sec, decay) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function tone(o) {
    if (!ctx) return;
    const { f = 440, t = 0, dur = 0.3, type = 'sine', vol = 0.2, a = 0.008, to = null, glide = null, bus = sfxBus, filter = null, detune = 0 } = o;
    const st = ctx.currentTime + Math.max(0, t);
    const osc = ctx.createOscillator(); osc.type = type; osc.frequency.setValueAtTime(f, st); osc.detune.value = detune;
    if (to) osc.frequency.exponentialRampToValueAtTime(to, st + (glide || dur * 0.8));
    const g = ctx.createGain(); env(g, st, a, vol, dur);
    let n = osc;
    if (filter) { const fl = ctx.createBiquadFilter(); fl.type = filter.type || 'lowpass'; fl.frequency.value = filter.f; fl.Q.value = filter.q || 0.8; osc.connect(fl); n = fl; }
    n.connect(g); g.connect(bus); osc.start(st); osc.stop(st + dur + 0.05);
  }
  function noise(o) {
    if (!ctx) return;
    const { t = 0, dur = 0.3, vol = 0.2, type = 'bandpass', f = 1000, to = null, q = 1, a = 0.01, bus = sfxBus } = o;
    const st = ctx.currentTime + Math.max(0, t);
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, st);
    if (to) fl.frequency.exponentialRampToValueAtTime(to, st + dur);
    fl.Q.value = q;
    const g = ctx.createGain(); env(g, st, a, vol, dur);
    s.connect(fl); fl.connect(g); g.connect(bus); s.start(st, Math.random() * 1.2); s.stop(st + dur + 0.05);
  }
  function bell(f, t = 0, vol = 0.12, dur = 1.4, bus) {
    tone({ f, t, dur, vol, a: 0.004, bus: bus || sfxBus });
    tone({ f: f * 2.01, t, dur: dur * 0.55, vol: vol * 0.3, a: 0.004, bus: bus || sfxBus });
    tone({ f: f * 3.98, t, dur: dur * 0.25, vol: vol * 0.12, a: 0.003, bus: bus || sfxBus });
  }

  /* ---- 夜晚環境音樂：五聲音階隨機漫步 + 柔和長音 ---- */
  const BEAT = 0.6;
  function startAmbient() {
    if (ambTimer) return;
    ambNext = ctx.currentTime + 0.4;
    const pg = ctx.createGain(); pg.gain.value = 0; pg.connect(musicBus);
    pg.gain.setTargetAtTime(0.035, ctx.currentTime, 2);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650; lp.connect(pg);
    [[-12, 0], [-5, 5], [-12, -6]].forEach(([s, det]) => {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f0(root + s); o.detune.value = det;
      o.connect(lp); o.start(); pad.push({ o, s });
    });
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.08;
    const lg = ctx.createGain(); lg.gain.value = 0.012; lfo.connect(lg); lg.connect(pg.gain); lfo.start();
    ambTimer = setInterval(schedule, 100);
  }
  function schedule() {
    if (!ctx) return;
    while (ambNext < ctx.currentTime + 0.4) { step(ambNext); ambNext += BEAT; }
  }
  function step(time) {
    const k = ambStep++;
    const t = time - ctx.currentTime;
    if (time < quietUntil) return;
    if (k % 8 === 0) tone({ f: f0(root - 12), t, dur: 4.6, vol: 0.05, a: 0.8, bus: musicBus });
    if (k % 16 === 8) tone({ f: f0(root - 5 - 12), t, dur: 4.6, vol: 0.04, a: 0.8, bus: musicBus });
    if (Math.random() < 0.55) {
      const moves = [-2, -1, -1, 0, 1, 1, 2];
      melIdx = Math.min(13, Math.max(4, melIdx + moves[Math.floor(Math.random() * moves.length)]));
      const f = pf(melIdx);
      tone({ f, t, dur: 1.9, vol: 0.05, a: 0.02, bus: musicBus });
      tone({ f: f * 2, t, dur: 0.6, vol: 0.01, a: 0.01, bus: musicBus });
      if (Math.random() < 0.18) tone({ f: pf(melIdx + 2), t: t + BEAT / 2, dur: 1.4, vol: 0.03, a: 0.02, bus: musicBus });
    }
  }
  function setRoot(r) {
    root = r;
    if (!ctx) return;
    pad.forEach(p => p.o.frequency.setTargetAtTime(f0(r + p.s), ctx.currentTime, 0.8));
  }
  function setMuted(m) {
    muted = m;
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ctx.currentTime, 0.06);
  }
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  const S = {
    init, setRoot, setMuted,
    get muted() { return muted; },
    click() { tone({ f: 900, to: 1400, dur: 0.09, type: 'triangle', vol: 0.1 }); },
    pop(v = 1) { tone({ f: 280, to: 820, glide: 0.07, dur: 0.16, vol: 0.2 * v }); tone({ f: 1300, t: 0.03, dur: 0.07, vol: 0.04 * v }); },
    paper() {
      noise({ f: 700, to: 3200, dur: 0.28, vol: 0.2, q: 0.7 });
      noise({ t: 0.13, f: 2600, to: 900, dur: 0.32, vol: 0.15, q: 0.9 });
      noise({ t: 0.3, type: 'highpass', f: 2500, dur: 0.16, vol: 0.07 });
    },
    twang() { tone({ f: 196, to: 170, dur: 0.55, type: 'sawtooth', vol: 0.08, filter: { f: 1400, q: 2 } }); tone({ f: 98, dur: 0.4, type: 'triangle', vol: 0.08 }); },
    whoosh() { noise({ f: 500, to: 3200, dur: 0.32, vol: 0.12, q: 1.4 }); },
    sparkle(i = 0) { bell(pf(10 + (i % 6)), 0, 0.07, 0.9); bell(pf(12 + (i % 6)), 0.06, 0.04, 0.7); },
    shimmer() { for (let i = 0; i < 9; i++) bell(pf(6 + i), i * 0.07, 0.05, 1.1); },
    chime() { [7, 9, 11, 12].forEach((n, i) => bell(pf(n), i * 0.12, 0.09, 2)); },
    dong() { tone({ f: 170, to: 62, glide: 0.22, dur: 0.5, vol: 0.42 }); noise({ type: 'lowpass', f: 500, dur: 0.12, vol: 0.22 }); tone({ f: 340, to: 200, dur: 0.1, type: 'triangle', vol: 0.06 }); },
    knock(v = 1) { tone({ f: 1150, to: 680, glide: 0.05, dur: 0.1, vol: 0.22 * v }); noise({ f: 2200, q: 6, dur: 0.07, vol: 0.22 * v }); tone({ f: 520, to: 420, dur: 0.08, type: 'triangle', vol: 0.1 * v }); },
    heal() { for (let i = 0; i < 6; i++) bell(pf(14 - i), i * 0.11, 0.035, 0.8); },
    boing() { tone({ f: 230, to: 620, glide: 0.1, dur: 0.22, vol: 0.15 }); tone({ f: 620, to: 330, t: 0.1, glide: 0.12, dur: 0.2, vol: 0.08 }); },
    ding(i = 0) { bell(pf(7 + i), 0, 0.11, 1.5); },
    cheer() { [5, 7, 9, 10].forEach((n, i) => tone({ f: pf(n), t: i * 0.08, dur: 0.35, type: 'triangle', vol: 0.08 })); },
    magic() { S.shimmer(); tone({ f: 420, to: 1260, glide: 1.4, dur: 1.6, vol: 0.04 }); },
    wind() { noise({ type: 'lowpass', f: 900, to: 350, dur: 1.8, vol: 0.06, a: 0.4 }); for (let i = 0; i < 5; i++) bell(pf(12 + Math.floor(Math.random() * 5)), 0.2 + i * 0.22, 0.035, 1); },
    fanfare() {
      [5, 7, 8, 9, 10].forEach((n, i) => { tone({ f: pf(n), t: i * 0.12, dur: 0.4, type: 'triangle', vol: 0.09 }); bell(pf(n + 5), i * 0.12, 0.05, 1); });
      [10, 12, 14].forEach(n => bell(pf(n), 0.7, 0.07, 2.4));
    },
    wrong() { tone({ f: pf(3), dur: 0.28, type: 'triangle', vol: 0.09 }); tone({ f: pf(1), t: 0.22, dur: 0.45, type: 'triangle', vol: 0.08 }); },
    ending() {
      if (!ctx) return;
      const mel = [[7,1],[8,1],[9,2],[8,1],[7,1],[5,2],[6,1],[7,1],[8,1],[6,1],[5,3],[null,1],[7,1],[9,1],[10,2],[9,1],[8,1],[7,2],[6,1],[5,1],[6,1],[4,1],[5,4]];
      const b = 0.42; let t = 0.2;
      mel.forEach(([n, d]) => {
        if (n !== null) { tone({ f: pf(n), t, dur: d * b + 0.9, type: 'triangle', vol: 0.07, a: 0.02, bus: musicBus }); bell(pf(n + 5), t, 0.03, 1.2, musicBus); }
        t += d * b;
      });
      const bars = Math.ceil(t / (4 * b));
      for (let k = 0; k < bars; k++) { const deg = [0, -5, -3, 0][k % 4]; tone({ f: f0(root - 12 + deg), t: 0.2 + k * 4 * b, dur: 4 * b + 0.6, vol: 0.05, a: 0.1, bus: musicBus }); }
      [5, 7, 9, 10].forEach((n, i) => bell(pf(n), t + i * 0.15, 0.07, 3, musicBus));
      quietUntil = ctx.currentTime + t + 2.5;
    }
  };
  return S;
})();

/* =========================================================
   狀態機：BOOKSHELF → BOOK_ZOOM → OPEN_COVER → SCENE_INTERACTION
            → PAGE_TURN → QUIZ → ENDING
   ========================================================= */
const FSM = {
  state: 'BOOKSHELF',
  locked: true,
  T: {
    BOOKSHELF: ['BOOK_ZOOM'],
    BOOK_ZOOM: ['OPEN_COVER', 'BOOKSHELF', 'ENDING'],
    OPEN_COVER: ['SCENE_INTERACTION'],
    SCENE_INTERACTION: ['PAGE_TURN', 'QUIZ', 'BOOK_ZOOM'],
    PAGE_TURN: ['SCENE_INTERACTION'],
    QUIZ: ['BOOK_ZOOM'],
    ENDING: ['BOOKSHELF']
  },
  go(s) {
    if (!this.T[this.state].includes(s)) { console.warn('[FSM] 不合法的狀態轉換：', this.state, '→', s); return false; }
    this.state = s; document.body.dataset.state = s; syncUI(); return true;
  },
  lock() { this.locked = true; document.body.classList.add('locked'); syncUI(); },
  unlock() { this.locked = false; document.body.classList.remove('locked'); syncUI(); }
};

/* =========================================================
   Three.js 基礎
   ========================================================= */
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f2c);
scene.fog = new THREE.Fog(0x0b0f2c, 34, 80);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 220);
const camTarget = V3(0, 6, -4);
camera.position.set(1, 11, 30);
camera.lookAt(camTarget);

let controls = null;
if (THREE.OrbitControls) {
  controls = new THREE.OrbitControls(camera, canvas);
  controls.enabled = false; controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.enablePan = false; controls.rotateSpeed = 0.5; controls.zoomSpeed = 0.6;
}
function enableControls() {
  if (!controls) return;
  if (gsap.isTweening(camera.position) || gsap.isTweening(camTarget)) {
    gsap.delayedCall(0.2, () => { if (!FSM.locked && FSM.state === 'SCENE_INTERACTION') enableControls(); });
    return;
  }
  controls.target.copy(camTarget);
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(camTarget));
  controls.minAzimuthAngle = sph.theta - 0.7; controls.maxAzimuthAngle = sph.theta + 0.7;
  controls.minPolarAngle = Math.max(0.2, sph.phi - 0.5); controls.maxPolarAngle = Math.max(sph.phi, Math.min(1.45, sph.phi + 0.25));
  controls.minDistance = sph.radius * 0.6; controls.maxDistance = sph.radius * 1.35;
  controls.enabled = true; controls.update();
}
function disableControls() { if (controls && controls.enabled) { controls.enabled = false; camTarget.copy(controls.target); } }

/* ---------- 版面常數 ---------- */
const DESK_Y = 3.0, BW = 2.2, BD = 2.8, PAGE_Y = 0.17, GY = 0.08;
const BOOK_DESK = V3(0, DESK_Y, 1.2);
const STAGE_O = V3(0, DESK_Y + PAGE_Y + 0.004, 1.2);
const SHELF = { x: -6.4, z: -3.6, top: 4.59 };
const WIN = { x: 4.6, y: 6.9, r: 2.35 };
const WALL_Z = -4.8;
const sv = a => STAGE_O.clone().add(V3(a[0], a[1], a[2]));
const SHOT_INTRO = { pos: V3(1, 11, 30), look: V3(0, 6, -4) };
const SHOT_SHELF = { pos: V3(-1.4, 6.7, 13.6), look: V3(-1.8, 4.7, -1.6) };
const SHOT_DESK = { pos: sv([0, 4.4, 4.6]), look: sv([0, 0.3, 0.2]) };
const READ = { pos: [0, 3.25, 7.0], look: [0, 0.5, 0.05] };
const SHOT_END_A = { pos: V3(0.8, 7.2, 17.5), look: V3(2.2, 6.0, -3) };
const SHOT_END_B = { pos: V3(3.2, 6.8, 13), look: V3(4.6, 7.4, -4.8) };

/* ---------- 鏡頭（GSAP 控制） ---------- */
let curShot = SHOT_INTRO;
function fitPos(pos, look) {
  const a = camera.aspect;
  const f = a < 1.5 ? Math.min(2.5, Math.pow(1.5 / a, 0.9)) : 1;
  return look.clone().add(pos.clone().sub(look).multiplyScalar(f));
}
function moveCam(shot, dur = 1.6, ease = 'power2.inOut') {
  disableControls();
  curShot = shot;
  const p = fitPos(shot.pos, shot.look);
  gsap.killTweensOf(camera.position); gsap.killTweensOf(camTarget);
  if (dur <= 0) { camera.position.copy(p); camTarget.copy(shot.look); return Promise.resolve(); }
  gsap.to(camTarget, { x: shot.look.x, y: shot.look.y, z: shot.look.z, duration: dur, ease });
  return new Promise(res => gsap.to(camera.position, { x: p.x, y: p.y, z: p.z, duration: dur, ease, onComplete: res, onInterrupt: res }));
}
const localShot = s => ({ pos: sv(s.pos), look: sv(s.look) });

/* ---------- 材質與幾何 ---------- */
const matCache = {};
function mat(color, o = {}) {
  const k = color + '|' + JSON.stringify(o);
  if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0, flatShading: true }, o));
  return matCache[k];
}
function matU(color, o = {}) {
  const m = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0, flatShading: true }, o));
  m.userData.unique = true; return m;
}
function mesh(geo, m, x = 0, y = 0, z = 0) {
  const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = true; me.receiveShadow = true; return me;
}
const G = {
  box: (w, h, d) => new THREE.BoxGeometry(w, h, d),
  sph: (r, w = 10, h = 8) => new THREE.SphereGeometry(r, w, h),
  cyl: (rt, rb, h, s = 10) => new THREE.CylinderGeometry(rt, rb, h, s),
  cone: (r, h, s = 8) => new THREE.ConeGeometry(r, h, s),
  ico: (r, d = 0) => new THREE.IcosahedronGeometry(r, d),
  tor: (r, t, rs = 6, ts = 16, arc = Math.PI * 2) => new THREE.TorusGeometry(r, t, rs, ts, arc)
};
function rbox(w, h, d, b = 0.04) {
  b = Math.min(b, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001);
  const s = new THREE.Shape(), x = w / 2 - b, y = h / 2 - b;
  s.moveTo(-x, -y); s.lineTo(x, -y); s.lineTo(x, y); s.lineTo(-x, y); s.lineTo(-x, -y);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(d - 2 * b, 0.001), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 4 });
  g.translate(0, 0, -(d - 2 * b) / 2);
  return g;
}
const HIT_MAT = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false });
function hitMesh(geo) { const m = new THREE.Mesh(geo, HIT_MAT); m.userData.hit = true; return m; }
const noRay = o => { o.raycast = () => {}; return o; };

/* ---------- Canvas 程式生成貼圖（非外部圖片） ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
const glowTex = canvasTex(128, 128, (g) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.22, 'rgba(255,255,255,.55)');
  gr.addColorStop(0.55, 'rgba(255,255,255,.12)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});
const dotTex = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
const flowerTex = canvasTex(64, 64, (g) => {
  g.translate(32, 32);
  for (let i = 0; i < 4; i++) { g.rotate(Math.PI / 2); g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(0, -13, 8, 13, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = 'rgba(255,240,200,1)'; g.beginPath(); g.arc(0, 0, 6, 0, Math.PI * 2); g.fill();
});
function glowSprite(color, s, opacity = 0.8, fog = true) {
  const m = new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, fog });
  m.userData.unique = true;
  const sp = new THREE.Sprite(m); sp.scale.set(s, s, 1); noRay(sp); return sp;
}
function skyTexture(top, bottom, o = {}) {
  const t = canvasTex(512, 320, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, top); gr.addColorStop(1, bottom);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    if (o.haze) {
      const hg = g.createRadialGradient(o.haze.x * w, o.haze.y * h, 0, o.haze.x * w, o.haze.y * h, w * 0.5);
      hg.addColorStop(0, o.haze.c); hg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = hg; g.fillRect(0, 0, w, h);
    }
    if (o.stars) {
      for (let i = 0; i < o.stars; i++) {
        const x = Math.random() * w, y = Math.random() * h * 0.72, r = Math.random() * 1.3 + 0.3;
        g.fillStyle = `rgba(255,250,225,${0.35 + Math.random() * 0.65})`;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
      for (let i = 0; i < 9; i++) {
        const x = Math.random() * w, y = Math.random() * h * 0.6, s = 4 + Math.random() * 5;
        g.fillStyle = 'rgba(255,244,200,.9)'; g.beginPath();

/* =========================================================
   流程：開書 → 各幕 → 翻頁 → 測驗 → 闔書 → 結局
   ========================================================= */
function flyBook(b, p0, q0, s0, p1, q1, s1, toDesk, dur) {
  const c1 = toDesk ? p0.clone().add(V3(0, 0.4, 2.6)) : p0.clone().add(V3(0, 3.2, 0.5));
  const c2 = toDesk ? p1.clone().add(V3(0, 3.2, 0.5)) : p1.clone().add(V3(0, 0.4, 2.6));
  const pr = { t: 0 };
  return new Promise(res => gsap.to(pr, {
    t: 1, duration: dur, ease: 'power2.inOut',
    onUpdate: () => {
      const t = pr.t, it = 1 - t;
      b.position.set(0, 0, 0)
        .addScaledVector(p0, it * it * it).addScaledVector(c1, 3 * it * it * t)
        .addScaledVector(c2, 3 * it * t * t).addScaledVector(p1, t * t * t);
      b.quaternion.copy(q0).slerp(q1, t);
      b.scale.setScalar(s0 + (s1 - s0) * t);
    },
    onComplete: res
  }));
}
async function openBook(i) {
  if (FSM.locked || FSM.state !== 'BOOKSHELF') return;
  FSM.lock();
  if (!FSM.go('BOOK_ZOOM')) { FSM.unlock(); return; }
  Sound.click(); hideShelfPanel(); hideHintMarker(); setHover(null);
  cur.book = i; cur.act = 0;
  document.body.dataset.book = i;
  Sound.setRoot(BOOKS[i].root);
  stageLight.color.setHex(BOOKS[i].light);
  const b = bookObjs[i];
  moveCam(SHOT_DESK, 2.2);
  Sound.whoosh();
  await flyBook(b, b.position.clone(), b.quaternion.clone(), b.scale.x, BOOK_DESK, new THREE.Quaternion(), 1, true, 2.2);
  FSM.go('OPEN_COVER');
  Sound.paper();
  const u = b.userData; u.label.visible = false;
  gsap.to(u.spine.scale, { y: 0.5, duration: 0.8 }); gsap.to(u.spine.position, { y: 0.085, duration: 0.8 });
  gsap.to(stageLight, { intensity: 0.7, duration: 1.5 });
  await gsap.to(u.pivot.rotation, { z: Math.PI, duration: 1.3, ease: 'power2.inOut' });
  b.add(stage); stage.position.set(0, PAGE_Y + 0.004, 0);
  await enterAct(0);
}
async function enterAct(ai) {
  cur.act = ai;
  const def = BOOKS[cur.book].acts[ai];
  const A = makeActCtx();
  const act = def.build(A);
  Object.assign(act, { A, def, remaining: act.needed || 1, done: false });
  cur.actObj = act;
  updateChapter();
  let k = 0;
  A.items.forEach(o => {
    if (o.userData.isBackdrop) {
      o.rotation.x = Math.PI / 2 * 0.98;
      gsap.to(o.rotation, { x: 0, duration: 1.0, ease: 'back.out(1.3)' });
    } else {
      const bs = o.userData.base; o.scale.set(bs.x, 0.001, 0.001);
      const idx = k++;
      gsap.to(o.scale, { y: bs.y, z: bs.z, duration: 1.0, delay: 0.3 + idx * 0.07, ease: 'elastic.out(1,.55)', onStart: () => { if (idx % 2 === 0) Sound.pop(0.5); } });
    }
  });
  moveCam(localShot(act.shot || READ), 1.6);
  await wait(Math.max(1.7, 0.3 + k * 0.07 + 0.7));
  if (act.onEnter) await act.onEnter();
  showDialog('旁白', def.intro, hintText(act));
  showHintMarker(act.hintTarget || A.picks[act.targets[0]], act.hintOffset);
  FSM.go('SCENE_INTERACTION'); FSM.unlock(); enableControls();
}
async function handleActPick(obj) {
  const act = cur.actObj; if (!act) return;
  const id = obj.userData.pickId;
  if (!act.done && act.targets.includes(id)) {
    FSM.lock(); disableControls(); hideHintMarker(); Sound.click();
    act.remaining--;
    try { await act.interact(act.needed - act.remaining, act.remaining); } catch (e) { console.error(e); }
    if (act.remaining <= 0) {
      act.done = true;
      showDialog('旁白', act.def.outro, '');
      showNext(cur.act < 2 ? '翻到下一頁 ▶' : '進入小測驗 ✎');
    } else {
      if (act.midText) showDialog('旁白', act.midText(act.needed - act.remaining), hintText(act));
      else setHint(hintText(act));
      showHintMarker(act.hintTarget || act.A.picks[act.targets[0]], act.hintOffset);
    }
    FSM.unlock(); enableControls();
  } else if (obj.userData.bouncer) {
    FSM.lock();
    squash(obj); Sound.pop();
    await wait(0.45);
    FSM.unlock();
  }
}
async function flattenStage() {
  const items = stage.children.slice();
  let n = 0;
  items.forEach(o => {
    if (o.userData.isBackdrop) gsap.to(o.rotation, { x: Math.PI / 2 * 0.98, duration: 0.6, delay: 0.15, ease: 'power2.in' });
    else gsap.to(o.scale, { y: 0.001, z: 0.001, duration: 0.45, delay: (n++) * 0.03, ease: 'back.in(1.6)' });
  });
  Sound.paper();
  await wait(Math.max(0.8, 0.5 + n * 0.03));
}
function clearStage() {
  const act = cur.actObj;
  if (act && act.A) act.A.tweens.forEach(t => t.kill());
  killTweensDeep(stage); killTweensDeep(fxGroup);
  stage.children.slice().forEach(c => { stage.remove(c); disposeTree(c); });
  fxGroup.children.slice().forEach(c => { fxGroup.remove(c); disposeTree(c); });
  fxUpdaters.length = 0; idleChars.length = 0; cur.actObj = null;
}
async function onNext() {
  if (FSM.locked || FSM.state !== 'SCENE_INTERACTION' || !cur.actObj || !cur.actObj.done) return;
  FSM.lock(); Sound.click(); hideNext();
  if (cur.act < 2) await turnPage(cur.act + 1);
  else await toQuiz();
}
async function turnPage(next) {
  FSM.go('PAGE_TURN'); hideDialog(); hideHintMarker(); disableControls();
  await flattenStage(); clearStage();
  const b = bookObjs[cur.book];
  const page = makeTurnPage(); b.add(page);
  Sound.paper();
  const pr = { p: 0 };
  await gsap.to(pr, { p: 1, duration: 1.1, ease: 'power2.inOut', onUpdate: () => bendPage(page, pr.p) });
  b.remove(page); disposeTree(page);
  await enterAct(next);
}

/* ---------- 測驗 ---------- */
async function toQuiz() {
  FSM.go('QUIZ'); hideDialog(); hideHintMarker(); disableControls();
  cur.act = 3; updateChapter();
  const q = BOOKS[cur.book].quiz;
  $('#qText').textContent = q.q; $('#qFb').textContent = '';
  const box = $('#qOpts'); box.innerHTML = '';
  q.opts.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'opt';
    b.innerHTML = `<span class="k">${'AB'[i]}</span><span></span>`; b.lastChild.textContent = t;
    b.addEventListener('click', () => answer(i, b));
    box.appendChild(b);
  });
  await wait(0.3);
  $('#quiz').classList.add('show');
  FSM.unlock();
}
async function answer(i, btn) {
  if (FSM.locked || FSM.state !== 'QUIZ') return;
  FSM.lock();
  const q = BOOKS[cur.book].quiz;
  if (i === q.ans) {
    btn.classList.add('right'); $('#qFb').textContent = q.ok; Sound.fanfare();
    await wait(2.2);
    $('#quiz').classList.remove('show');
    const bd = BOOKS[cur.book].badge;
    $('#bIcon').innerHTML = document.querySelector(`.slot[data-b="${cur.book}"]`).innerHTML;
    $('#bName').textContent = `「${bd.name}」`; $('#bDesc').textContent = bd.desc;
    await wait(0.35);
    $('#badgeModal').classList.add('show'); Sound.chime();
  } else {
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    $('#qFb').textContent = q.no; Sound.wrong();
    await wait(0.6);
  }
  FSM.unlock();
}
async function collectBadge() {
  if (FSM.locked || FSM.state !== 'QUIZ') return;
  FSM.lock(); Sound.click();
  $('#badgeModal').classList.remove('show');
  badges[cur.book] = true; updateBadgeUI(cur.book); Sound.sparkle(3);
  await closeBook();
}
async function closeBook() {
  FSM.go('BOOK_ZOOM');
  hideDialog(); hideChapter(); disableControls(); hideHintMarker();
  await flattenStage(); clearStage();
  const b = bookObjs[cur.book], u = b.userData;
  b.remove(stage);
  moveCam(SHOT_DESK, 1.0);
  Sound.paper();
  gsap.to(u.spine.scale, { y: 1, duration: 0.8, delay: 0.4 }); gsap.to(u.spine.position, { y: 0.17, duration: 0.8, delay: 0.4 });
  await gsap.to(u.pivot.rotation, { z: 0, duration: 1.1, ease: 'power2.inOut' });
  u.label.visible = true;
  if (badges[cur.book]) u.medal.visible = true;
  gsap.to(stageLight, { intensity: 0, duration: 1.5 });
  moveCam(SHOT_SHELF, 2.2);
  Sound.whoosh();
  await flyBook(b, b.position.clone(), b.quaternion.clone(), b.scale.x, u.rest, SHELF_Q, SHELF_S, false, 2.2);
  cur.book = null; document.body.dataset.book = '';
  if (badges.every(Boolean)) { await playEnding(); return; }
  FSM.go('BOOKSHELF'); showShelfPanel(); pointShelfHint();
  FSM.unlock();
}
function pointShelfHint() {
  const n = badges.findIndex(x => !x);
  if (n >= 0) showHintMarker(bookObjs[n], [0.05, -0.45, 0.8]); else hideHintMarker();
}
async function goHome() {
  if (FSM.locked || FSM.state !== 'SCENE_INTERACTION') return;
  FSM.lock(); Sound.click();
  await closeBook();
}

/* ---------- 結局 ---------- */
let endingOn = false;
async function playEnding() {
  FSM.go('ENDING'); hideShelfPanel(); hideHintMarker();
  await moveCam(SHOT_END_A, 2.4);
  wedges.forEach((w, i) => {
    gsap.to(w.position, { x: plateC.x, z: plateC.z, y: DESK_Y + 0.06, duration: 1.2, delay: i * 0.35, ease: 'back.inOut(1.4)', onStart: () => Sound.pop() });
    gsap.to(w.rotation, { y: i * Math.PI / 2, duration: 1.2, delay: i * 0.35, ease: 'power2.inOut' });
  });
  await wait(2.5);
  burst(plateC.clone().add(V3(0, 0.3, 0)), { count: 26, spread: 0.9, color: 0xffe08a, dur: 1.2 });
  Sound.chime();
  gsap.to(roomMoon.scale, { x: 1.5, y: 1.5, z: 1.5, duration: 5, ease: 'sine.inOut' });
  gsap.to(roomMoon.position, { x: 6.4, y: 8.3, duration: 5, ease: 'sine.inOut' });
  gsap.to(roomMoonMat, { emissiveIntensity: 1.2, duration: 4 });
  gsap.to(roomMoonGlow.material, { opacity: 0.95, duration: 4 }); gsap.to(roomHalo.material, { opacity: 0.32, duration: 4 });
  lanternAmp = 0.16; endingOn = true;
  skyLanterns.forEach(l => { l.visible = true; });
  Sound.ending();
  moveCam(SHOT_END_B, 7, 'sine.inOut');
  $('#ending').classList.add('show');
  await wait(3.5);
  $('#ending').classList.add('ready');
  FSM.unlock();
}
async function replay() {
  if (FSM.locked || FSM.state !== 'ENDING') return;
  FSM.lock(); Sound.click();
  $('#ending').classList.remove('show', 'ready');
  lanternAmp = 0.06; endingOn = false;
  FSM.go('BOOKSHELF');
  await moveCam(SHOT_SHELF, 2.4);
  skyLanterns.forEach(l => { l.visible = false; });
  showShelfPanel(); pointShelfHint();
  FSM.unlock();
}

/* =========================================================
   點擊與懸停
   ========================================================= */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function visibleChain(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function pickAt(cx, cy) {
  let roots;
  if (FSM.state === 'BOOKSHELF') roots = bookObjs;
  else if (FSM.state === 'SCENE_INTERACTION') roots = [stage];
  else return null;
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const found = [];
  for (const h of raycaster.intersectObjects(roots, true)) {
    if (!visibleChain(h.object)) continue;
    let o = h.object; while (o && o.userData.pickId === undefined) o = o.parent;
    if (o && !found.includes(o)) found.push(o);
  }
  if (!found.length) return null;
  const act = cur.actObj;
  if (FSM.state === 'SCENE_INTERACTION' && act && !act.done) {
    const t = found.find(o => act.targets.includes(o.userData.pickId));
    if (t) return t;
  }
  return found[0];
}
function handleClick(x, y) {
  if (!introDone || FSM.locked) return;
  const o = pickAt(x, y); if (!o) return;
  if (FSM.state === 'BOOKSHELF' && o.userData.idx !== undefined) openBook(o.userData.idx);
  else if (FSM.state === 'SCENE_INTERACTION') handleActPick(o);
}
let hovered = null;
function setHover(b) {
  if (hovered === b) return;
  if (hovered) gsap.to(hovered.position, { z: hovered.userData.rest.z, duration: 0.35, ease: 'power2.out' });
  hovered = b;
  if (b) { gsap.to(b.position, { z: b.userData.rest.z + 0.35, duration: 0.35, ease: 'back.out(2)' }); Sound.pop(0.35); }
}
let down = null, mouse = null, mouseMoved = false;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
window.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (moved < 8) handleClick(e.clientX, e.clientY);
  down = null;
});
canvas.addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; mouseMoved = true; });
canvas.addEventListener('pointerleave', () => { mouse = null; mouseMoved = true; });
function updateHover() {
  if (!mouseMoved) return; mouseMoved = false;
  let o = null;
  if (mouse && introDone && !FSM.locked) o = pickAt(mouse.x, mouse.y);
  canvas.style.cursor = o ? 'pointer' : '';
  if (FSM.state === 'BOOKSHELF' && !FSM.locked) setHover(o && o.userData.idx !== undefined ? o : null);
}

/* ---------- DOM 事件 ---------- */
$('#btnNext').addEventListener('click', onNext);
$('#btnHome').addEventListener('click', goHome);
$('#btnCollect').addEventListener('click', collectBadge);
$('#btnReplay').addEventListener('click', replay);
document.querySelectorAll('.bookbtn').forEach(b => b.addEventListener('click', () => openBook(+b.dataset.book)));
$('#btnMute').addEventListener('click', () => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  $('#icoSound').classList.toggle('hidden', Sound.muted); $('#icoMute').classList.toggle('hidden', !Sound.muted);
});
$('#intro').addEventListener('pointerup', async () => {
  if (introDone) return;
  introDone = true;
  Sound.init(); Sound.chime();
  $('#intro').classList.add('bye');
  await moveCam(SHOT_SHELF, 3.2, 'power2.inOut');
  showShelfPanel(); pointShelfHint();
  FSM.unlock();
});

/* =========================================================
   滑鼠月光粒子拖曳（Canvas 2D，宛如飄落的桂花）
   ========================================================= */
const trail = $('#trail'), tctx = trail.getContext('2d');
function sizeTrail() { const d = Math.min(window.devicePixelRatio || 1, 2); trail.width = innerWidth * d; trail.height = innerHeight * d; tctx.setTransform(d, 0, 0, d, 0, 0); }
sizeTrail();
const dotSpr = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,248,210,1)'); gr.addColorStop(0.35, 'rgba(255,214,110,.8)'); gr.addColorStop(1, 'rgba(255,190,60,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32); return c;
})();
const flowerSpr = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
  g.translate(16, 16);
  for (let i = 0; i < 4; i++) { g.rotate(Math.PI / 2); g.fillStyle = '#ffc93c'; g.beginPath(); g.ellipse(0, -6.5, 4.2, 6.5, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#fff3b0'; g.beginPath(); g.arc(0, 0, 3, 0, Math.PI * 2); g.fill(); return c;
})();
const parts = []; let lastPt = null;
window.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  const n = lastPt ? Math.min(3, 1 + Math.floor(Math.hypot(x - lastPt.x, y - lastPt.y) / 18)) : 1;
  for (let i = 0; i < n && parts.length < 240; i++) {
    parts.push({ x: x + rand(-4, 4), y: y + rand(-4, 4), vx: rand(-0.25, 0.25), vy: rand(0.1, 0.6), life: 1, dec: rand(0.012, 0.022), s: rand(6, 14), rot: rand(0, 6.28), vr: rand(-0.05, 0.05), ph: rand(0, 6.28), fl: Math.random() < 0.4 });
  }
  lastPt = { x, y };
}, { passive: true });
function drawTrail() {
  tctx.clearRect(0, 0, innerWidth, innerHeight);
  if (!parts.length) return;
  tctx.globalCompositeOperation = 'lighter';
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= p.dec;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.ph += 0.06; p.x += p.vx + Math.sin(p.ph) * 0.35; p.y += p.vy; p.vy = Math.min(p.vy + 0.008, 1.2); p.rot += p.vr;
    tctx.globalAlpha = p.life * 0.9;
    const s = p.s * (0.5 + p.life * 0.5);
    if (p.fl) { tctx.save(); tctx.translate(p.x, p.y); tctx.rotate(p.rot); tctx.drawImage(flowerSpr, -s / 2, -s / 2, s, s); tctx.restore(); }
    else tctx.drawImage(dotSpr, p.x - s / 2, p.y - s / 2, s, s);
  }
  tctx.globalAlpha = 1; tctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   視窗縮放與主迴圈
   ========================================================= */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); sizeTrail();
  if (!FSM.locked && introDone) moveCam(curShot, 0.4).then(() => { if (!FSM.locked && FSM.state === 'SCENE_INTERACTION') enableControls(); });
});
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  roomLanterns.forEach((l, i) => { l.rotation.z = lanternAmp * Math.sin(t * 1.1 + i * 1.3); l.rotation.x = lanternAmp * 0.5 * Math.cos(t * 0.9 + i); });
  starMat.opacity = 0.75 + Math.sin(t * 1.7) * 0.2;
  if (endingOn) skyLanterns.forEach(l => { l.position.y += l.userData.sp * dt; l.position.x += Math.sin(t + l.userData.ph) * 0.004; if (l.position.y > 18) l.position.y = -1; });
  idleChars.forEach(c => {
    const u = c.userData;
    u.idle.scale.y = 1 + Math.sin(t * 2.2 + u.phase) * 0.018;
    u.idle.rotation.z = Math.sin(t * 1.3 + u.phase) * 0.025;
    if (u.ribbons) {
      const amp = u.ribbonAmp || 0.15;
      u.ribbons.forEach((rb, k) => rb.userData.joints.forEach((j, n) => {
        j.rotation.z = amp * Math.sin(t * 2.4 + n * 0.8 + k * 1.7) * (k ? 1 : -1);
        j.rotation.x = amp * 0.7 * Math.cos(t * 2 + n * 0.6 + k);
      }));
    }
    if (u.ears) u.ears.forEach((e, k) => { e.rotation.x = Math.sin(t * 3 + k + u.phase) * 0.08; });
  });
  if (cur.actObj && cur.actObj.update) cur.actObj.update(t, dt);
  for (let i = fxUpdaters.length - 1; i >= 0; i--) if (fxUpdaters[i](dt, t) === false) fxUpdaters.splice(i, 1);
  if (hintObj && hintMk.visible) {
    const p = topOf(hintObj).add(hintOff);
    hintMk.position.set(p.x, p.y + 0.22 + Math.sin(t * 4) * 0.06, p.z);
    hintMk.rotation.y += dt * 2;
    hintMk.visible = !FSM.locked;
  } else if (hintObj && !FSM.locked) hintMk.visible = true;
  if (controls && controls.enabled) { controls.update(); camTarget.copy(controls.target); }
  else camera.lookAt(camTarget);
  updateHover();
  renderer.render(scene, camera);
  drawTrail();
}
moveCam(SHOT_INTRO, 0);
updateBadgeUI();
loop();

// 唯讀狀態查詢（方便除錯與自動化測試，不影響流程）
window.MoonBook = {
  get state() { return FSM.state; }, get locked() { return FSM.locked; },
  screenOf(id) {
    let o = null;
    if (id && id.startsWith('book')) o = bookObjs[+id.slice(4)];
    else if (cur.actObj) o = cur.actObj.A.picks[id];
    if (!o) return null;
    const p = (id === 'axe' || id === 'moon' || id.startsWith('book')) ? wpos(o) : topOf(o).add(V3(0, -0.35 * o.scale.y, 0));
    p.project(camera);
    return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight };
  },
  get targets() { return cur.actObj ? cur.actObj.targets : []; },
  pickIdAt(x, y) { const o = pickAt(x, y); return o ? o.userData.pickId : null; }
};
})();
